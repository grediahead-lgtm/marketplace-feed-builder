[project]
name = "marketplace-feed-builder"
version = "0.1.0"
description = "Turns a simple product table (CSV) into a Prom.ua import file (XLSX) and a report of everything that breaks Prom's field limits. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dmytro Grechyshchev" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
